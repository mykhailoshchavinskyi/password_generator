name: Release

# Тег v* збирає програму для всіх ОС і публікує GitHub Release.
# Ручний запуск (Run workflow): з порожнім полем tag лише збирає файли як артефакти;
# з tag, наприклад v1.0.0, створює цей тег на поточному коміті й публікує реліз.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релізу (наприклад v1.0.0). Порожньо — лише збірка."
        required: false
        default: ""

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read

jobs:
  build:
    name: Збірка · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel, os: macos-15-intel }
          # старіший glibc, щоб AppImage запускався на більшій кількості дистрибутивів
          - { name: Linux x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Linux — бібліотеки Qt і appimagetool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - run: pip install ".[build]"
      - run: python scripts/build.py

      - name: Перевірка зібраного файлу (Linux)
        if: runner.os == 'Linux'
        env: { PASSGEN_SMOKE_TEST: "1", QT_QPA_PLATFORM: offscreen }
        run: ./release/*.AppImage --appimage-extract-and-run
      - name: Перевірка зібраного файлу (macOS)
        if: runner.os == 'macOS'
        env: { PASSGEN_SMOKE_TEST: "1", QT_QPA_PLATFORM: offscreen }
        run: ./dist/Passgen.app/Contents/MacOS/Passgen
      - name: Перевірка зібраного файлу (Windows)
        if: runner.os == 'Windows'
        env: { PASSGEN_SMOKE_TEST: "1", QT_QPA_PLATFORM: offscreen }
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Passgen exited with code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: passgen-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Публікація релізу
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Версія в коді збігається з тегом
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/passgen/__init__.py)
          if [ "v$code_version" != "$RELEASE_TAG" ]; then
            echo "::error::Тег $RELEASE_TAG, а в src/passgen/__init__.py версія $code_version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Контрольні суми
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Passgen ${{ env.RELEASE_TAG }}
          files: release/*
          generate_release_notes: true
